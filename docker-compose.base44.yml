# Base44 sandbox environment for this project.
# The app is a single static page (index.html) with no build step and no
# backend, so one service runs a zero-dependency static dev server directly
# from the bind-mounted working tree.
#
#   docker compose -f docker-compose.base44.yml up -d --build
#
services:
  web:
    image: node:22-alpine
    working_dir: /app
    command: ["node", ".base44/dev-server.mjs"]
    environment:
      - PORT=3000
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 4s
      retries: 5
      start_period: 5s
    restart: on-failure
